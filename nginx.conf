server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /healthz {
    return 200 'ok';
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(?:html)$ {
    add_header Cache-Control "no-store";
  }

  location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
